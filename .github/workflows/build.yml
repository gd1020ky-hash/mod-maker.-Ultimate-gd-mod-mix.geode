name: Build Mod Packages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compile Core Targets
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Build Platform Binary
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Combine Build Package
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - name: Merge Output Files
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload Packaged Mod File
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-GD-Mod-Mix-Build
          path: ${{ steps.build.outputs.build-output }}
          
