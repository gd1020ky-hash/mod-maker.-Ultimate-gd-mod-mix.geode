name: Build Mod Packages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Cross-Compile Multiplatform Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # Targets both desktop and mobile devices simultaneously
          win: true
          android32: true
          android64: true
          mac: false
          ios: false

      - name: Upload Packaged Mod File
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-GD-Mod-Mix-Build
          path: build/*.geode
          
